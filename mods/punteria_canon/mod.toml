name = "Punteria del canon"
version = "1.1"
author = "Mobius01"
game = "SLUS-20152"
description = "Ayuda de punteria para el canon y mira de anticipacion: un circulo marca adonde apuntar la nariz para que las balas alcancen al enemigo (verde = la ayuda ya acierta)."
enabled = false

[config]
# ayuda: true = si un enemigo esta cerca de la linea de tiro, las balas van
#   adonde estara cuando lleguen (calcula la anticipacion por ti)
ayuda = true
# cono_grados: que tan cerca de la linea de tiro tiene que estar el enemigo
#   para que la ayuda actue (1 a 30 grados; mas grande = mas facil)
cono_grados = 5
# alcance: distancia maxima en unidades del juego (una bala vive unos 54 cuadros:
#   unas 4500 unidades; mas alla no llega)
alcance = 4500
# fuerza: 1 = las balas van justo al punto de impacto calculado; 0.5 = a medio
#   camino entre donde apuntas y ese punto
fuerza = 1
# mira: true = dibuja un circulo donde tienes que poner la nariz del avion para
#   acertarle al enemigo mas cercano a tu linea de tiro (dentro del alcance).
#   Ambar: todavia falta apuntar; verde: ya esta dentro del cono de la ayuda.
mira = true
# mira_cono_grados: hasta cuantos grados de la nariz busca enemigos la mira (2 a 60)
mira_cono_grados = 25
# mira_tamano: radio del circulo en pixeles de PS2 (4 a 30)
mira_tamano = 9
